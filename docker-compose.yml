version: "3.9"

services:
  # ── Backend: FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churn_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_VERSION=1.0.0
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:8501
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend: Streamlit ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn_frontend
    ports:
      - "8501:8501"
    environment:
      # The frontend contacts the backend by service name inside the Docker network
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
